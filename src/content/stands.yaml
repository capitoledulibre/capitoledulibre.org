# Stands confirmés du village associatif.
#
# Source: the "Stand Espace Associatif" submissions accepted in Pretalx. They
# carry no schedule slot, so the public Pretalx API does not expose them and the
# list has to be maintained here by hand.
#
# `name` is the exhibitor as it should read on the site: the redundant "Stand"
# prefix is dropped, and so is "Association" when the organisation has a proper
# name of its own. Everything descriptive in the original submission title moves
# to `tagline`, which is optional.

